# Optional local Postgres (alternative to `npm run db:dev`, which needs no Docker).
#   docker compose up -d
#   DATABASE_URL=postgres://vamoverse:vamoverse@localhost:5432/vamoverse npm run db:migrate
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vamoverse
      POSTGRES_PASSWORD: vamoverse
      POSTGRES_DB: vamoverse
    ports:
      - "5432:5432"
    volumes:
      - vamo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vamoverse -d vamoverse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vamo_pgdata:
